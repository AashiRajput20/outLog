version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outlog-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - outlog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outlog-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:5000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - outlog-network

  mongodb:
    image: mongo:latest
    container_name: outlog-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - outlog-network

volumes:
  mongodb_data:

networks:
  outlog-network:
    driver: bridge
